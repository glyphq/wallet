[advisories]
ignore = [
  # battery 0.7.8, used only for the device-diagnostics battery reading, pins
  # nix 0.19. Its vulnerable getgrouplist path is not used by battery's Linux
  # power-supply reader. Remove this exception when battery updates nix.
  "RUSTSEC-2021-0119",

  # glib VariantStrIter unsoundness (RUSTSEC-2024-0429).
  # Fixed in glib >=0.20.0, but libappindicator pins glib ^0.18 and has no
  # newer release. VariantStrIter is not exercised by any code path in this
  # app; upgrade when libappindicator supports glib 0.20+.
  "RUSTSEC-2024-0429",

  # The following warnings are inherited from Tauri's platform runtime. They
  # are all unmaintained-package notices rather than known exploitable
  # vulnerabilities. Keep these explicit because scripts/security-audit.sh
  # denies every warning not listed here.
  #
  # GTK3/WebKitGTK runtime used on Linux. These are blocked on Tauri's GTK4 /
  # WebKit6 migration. See SECURITY_AUDIT.md#linux-tauri-stack.
  "RUSTSEC-2024-0411",
  "RUSTSEC-2024-0412",
  "RUSTSEC-2024-0413",
  "RUSTSEC-2024-0414",
  "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0416",
  "RUSTSEC-2024-0417",
  "RUSTSEC-2024-0418",
  "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0420",
  "RUSTSEC-2024-0370",

  # Build-time dependency of Tauri's urlpattern parser.
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",

  # Target-specific dependencies that are not built on Linux.
  "RUSTSEC-2020-0168",
  "RUSTSEC-2024-0436",
]
