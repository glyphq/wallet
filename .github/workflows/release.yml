name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v0.14.2
        required: true
        type: string
      allow_unsigned_native:
        description: Keep macOS and Windows artifacts unsigned. Disable only after native signing is intentionally restored.
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.14"
  RUST_VERSION: "1.88.0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_CHANNEL: ${{ contains(inputs.tag, '-') && 'prerelease' || 'stable' }}
  UPDATER_MANIFEST: ${{ contains(inputs.tag, '-') && 'latest-prerelease.json' || 'latest.json' }}

jobs:
  prepare-release:
    name: Validate tag and prepare draft release
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prerelease'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Validate tag and synchronized versions
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # SemVer prereleases begin with a hyphen. Keeping this grammar aligned
          # with RELEASE_CHANNEL prevents dot-suffixed versions being published
          # to the stable channel.
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          version="${RELEASE_TAG#v}"
          [[ "$(node -p "require('./package.json').version")" == "$version" ]]
          node scripts/sync-version.mjs --check
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null
          [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" == "tag" ]] || {
            echo "Release tags must be annotated tag objects, not lightweight tags" >&2
            exit 1
          }
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$RELEASE_CHANNEL" == "stable" ]]; then
            git fetch origin main --no-tags
            git merge-base --is-ancestor "$tag_commit" origin/main || {
              echo "Stable release tag must point to a commit reachable from main" >&2
              exit 1
            }
          else
            git fetch origin prerelease --no-tags
            git merge-base --is-ancestor "$tag_commit" origin/prerelease || {
              echo "Prerelease tag must point to a commit reachable from prerelease" >&2
              exit 1
            }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_CHANNEL: ${{ env.RELEASE_CHANNEL }}
        run: |
          set -euo pipefail
          node scripts/extract-changelog.mjs "$VERSION" > release-notes.md
          expected_prerelease=false
          if [[ "$RELEASE_CHANNEL" == "prerelease" ]]; then
            expected_prerelease=true
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            release_json="$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease)"
            is_draft="$(jq -r '.isDraft' <<<"$release_json")"
            is_prerelease="$(jq -r '.isPrerelease' <<<"$release_json")"
            [[ "$is_draft" == "true" ]] || {
              echo "Release $RELEASE_TAG is already published and immutable" >&2
              exit 1
            }
            [[ "$is_prerelease" == "$expected_prerelease" ]] || {
              echo "Release $RELEASE_TAG prerelease flag does not match branch channel $RELEASE_CHANNEL" >&2
              exit 1
            }
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
            echo "Draft release $RELEASE_TAG already exists; notes were refreshed and assets will be reused idempotently."
          else
            release_flags=(
              --verify-tag
              --draft
              --title "Glyph $VERSION"
              --notes-file release-notes.md
            )
            if [[ "$RELEASE_CHANNEL" == "prerelease" ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${release_flags[@]}"
          fi

  release-linux:
    name: Build Linux bundles
    runs-on: ubuntu-22.04
    needs: prepare-release
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Check out reviewed release automation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          path: .release-automation
          persist-credentials: false
          sparse-checkout: scripts/upload-release-assets.mjs
          sparse-checkout-cone-mode: false

      - name: Preload authenticated pinned AppImage tools
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tauri_cache="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          patch_cache="${XDG_CACHE_HOME:-$HOME/.cache}/glyph/appimage-tools"
          mkdir -p "$tauri_cache" "$patch_cache"

          download_asset() {
            local endpoint="$1"
            local expected_sha="$2"
            local destination="$3"
            local temporary="${destination}.download"
            gh api \
              --header 'Accept: application/octet-stream' \
              "$endpoint" > "$temporary"
            echo "$expected_sha  $temporary" | sha256sum --check --status
            chmod 0755 "$temporary"
            mv -f "$temporary" "$destination"
          }

          # These immutable asset IDs and checksums match the tag-era helper
          # scripts. Preloading avoids unauthenticated API rate-limit/403 errors
          # while the release jobs continue to build the exact tagged source.
          download_asset \
            repos/tauri-apps/binary-releases/releases/assets/274691722 \
            f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f \
            "$tauri_cache/AppRun-x86_64"
          download_asset \
            repos/tauri-apps/binary-releases/releases/assets/182515537 \
            e762bea85c8eb0d4b3508d46e5c1f037f717d0f9303ae3b4aafc8b04991fa1ef \
            "$tauri_cache/linuxdeploy-x86_64.AppImage"
          download_asset \
            repos/linuxdeploy/linuxdeploy-plugin-appimage/releases/assets/228937581 \
            992d502a248e14ab185448ddf6f6e7d25558cb84d4623c354c3af350c25fccb3 \
            "$tauri_cache/linuxdeploy-plugin-appimage.AppImage"
          download_asset \
            repos/AppImage/AppImageKit/releases/assets/98605504 \
            b90f4a8b18967545fda78a445b27680a1642f1ef9488ced28b65398f2be7add2 \
            "$patch_cache/appimagetool-b90f4a8b.AppImage"
          download_asset \
            repos/probonopd/go-appimage/releases/assets/440974626 \
            376998aba63bb3a35a02ea3196f77268f8543a35a3b6b7db0dc2181365119b62 \
            "$patch_cache/go-appimagetool-947.AppImage"

      - name: Install minimal Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            xdg-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Configure sccache
        uses: mozilla/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9

      - name: Cache Rust registry and sources
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri
          cache-targets: "false"
          cache-on-failure: "true"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Configure prerelease updater channel
        if: env.RELEASE_CHANNEL == 'prerelease'
        run: node scripts/set-updater-channel.mjs prerelease

      - name: Prepare deterministic Tauri Linux bundler state
        run: |
          rm -rf \
            src-tauri/target/release/bundle/appimage/*.AppDir \
            src-tauri/target/release/bundle/appimage_deb
          scripts/prepare-tauri-linux-tools.sh

      - name: Validate updater signing credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]] || { echo "TAURI_SIGNING_PRIVATE_KEY is required" >&2; exit 1; }
          [[ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]] || { echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required" >&2; exit 1; }

      - name: Build signed AppImage
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          rm -rf \
            src-tauri/target/release/bundle/appimage/*.AppDir \
            src-tauri/target/release/bundle/appimage_deb
          bun tauri build --bundles appimage --ci

      - name: Build signed Linux packages
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun tauri build --bundles deb,rpm --ci --config configs/tauri-linux-packages.json

      - name: Patch and re-sign AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mapfile -t appimages < <(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | sort)
          [[ ${#appimages[@]} -eq 1 ]]
          appimage="${appimages[0]}"
          scripts/patch-appimage.sh "$appimage"
          rm -f "${appimage}.sig"
          bun tauri signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$appimage"

      - name: Validate Linux bundles
        env:
          REQUIRE_SIGNATURES: "1"
        run: scripts/validate-linux-bundles.sh src-tauri/target/release/bundle "${{ needs.prepare-release.outputs.version }}"

      - name: Create Linux checksums
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(find src-tauri/target/release/bundle/{appimage,deb,rpm} \
            -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) | sort)
          [[ ${#artifacts[@]} -eq 3 ]]
          sha256sum "${artifacts[@]}" | sed -E 's#  .*/#  #' > SHA256SUMS-linux.txt

      - name: Attest Linux release assets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            SHA256SUMS-linux.txt

      - name: Upload Linux assets to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find src-tauri/target/release/bundle/{appimage,deb,rpm} \
            -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.AppImage.sig' -o -name '*.deb' -o -name '*.rpm' \) | sort)
          [[ ${#assets[@]} -eq 4 ]]
          node .release-automation/scripts/upload-release-assets.mjs "$RELEASE_TAG" "${assets[@]}" SHA256SUMS-linux.txt

  release-macos:
    name: Build macOS bundles
    runs-on: macos-latest
    needs: prepare-release
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Check out reviewed release automation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          path: .release-automation
          persist-credentials: false
          sparse-checkout: scripts/upload-release-assets.mjs
          sparse-checkout-cone-mode: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Configure sccache
        uses: mozilla/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9

      - name: Cache Rust registry and sources
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri
          cache-targets: "false"
          cache-on-failure: "true"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Configure prerelease updater channel
        if: env.RELEASE_CHANNEL == 'prerelease'
        run: node scripts/set-updater-channel.mjs prerelease

      - name: Determine macOS signing mode
        id: macos-signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ALLOW_UNSIGNED_NATIVE: ${{ inputs.allow_unsigned_native }}
        run: |
          set -euo pipefail
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "$name is required" >&2; exit 1; }
          done
          if [[ "$ALLOW_UNSIGNED_NATIVE" == "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "MACOS_CODE_SIGNING_ENABLED=0" >> "$GITHUB_ENV"
            echo '::warning::Publishing macOS artifacts without Apple code signing or notarization because unsigned native artifacts are enabled.'
            exit 0
          fi
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "MACOS_CODE_SIGNING_ENABLED=1" >> "$GITHUB_ENV"
            echo "macOS code signing and notarization are enabled."
          else
            printf 'macOS releases require all signing and notarization secrets unless unsigned native artifacts are explicitly allowed: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Build universal macOS bundles
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ "$MACOS_CODE_SIGNING_ENABLED" == "1" ]]; then
            bun tauri build --target universal-apple-darwin --ci
          else
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            bun tauri build --target universal-apple-darwin --ci --config '{"bundle":{"macOS":{"signingIdentity":null}}}'
          fi

      - name: Normalize versioned macOS updater artifact names
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle_root="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          archives=("$bundle_root"/*.app.tar.gz)
          signatures=("$bundle_root"/*.app.tar.gz.sig)
          [[ ${#archives[@]} -eq 1 && ${#signatures[@]} -eq 1 ]]
          target="$bundle_root/Glyph_${VERSION}_universal.app.tar.gz"
          mv "${archives[0]}" "$target"
          mv "${signatures[0]}" "$target.sig"

      - name: Validate macOS bundles
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle_root="src-tauri/target/universal-apple-darwin/release/bundle"
          archives=("$bundle_root"/macos/*.app.tar.gz)
          signatures=("$bundle_root"/macos/*.app.tar.gz.sig)
          images=("$bundle_root"/dmg/*.dmg)
          apps=("$bundle_root"/macos/*.app)
          [[ ${#archives[@]} -eq 1 && ${#signatures[@]} -eq 1 && ${#images[@]} -eq 1 && ${#apps[@]} -eq 1 ]]
          [[ -s "${archives[0]}" && -s "${signatures[0]}" && -s "${images[0]}" ]]
          binary="${apps[0]}/Contents/MacOS/glyph-wallet"
          [[ -x "$binary" ]]
          lipo "$binary" -verify_arch x86_64 arm64
          if [[ "$MACOS_CODE_SIGNING_ENABLED" == "1" ]]; then
            codesign --verify --deep --strict --verbose=2 "${apps[0]}"
            codesign --verify --deep --strict --verbose=2 "${images[0]}"
            xcrun stapler validate "${images[0]}"
            spctl --assess --type open --context context:primary-signature --verbose=4 "${images[0]}"
          else
            echo "::notice::Skipping macOS codesign, notarization, and Gatekeeper validation for unsigned release artifacts."
          fi
          shasum -a 256 "${archives[0]}" "${images[0]}" | sed -E 's#  .*/#  #' > SHA256SUMS-macos.txt

      - name: Attest macOS release assets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            SHA256SUMS-macos.txt

      - name: Upload macOS assets to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle_root="src-tauri/target/universal-apple-darwin/release/bundle"
          assets=("$bundle_root"/macos/*.app.tar.gz "$bundle_root"/macos/*.app.tar.gz.sig "$bundle_root"/dmg/*.dmg)
          [[ ${#assets[@]} -eq 3 ]]
          node .release-automation/scripts/upload-release-assets.mjs "$RELEASE_TAG" "${assets[@]}" SHA256SUMS-macos.txt

  release-windows:
    name: Build Windows bundle
    runs-on: windows-latest
    needs: prepare-release
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Check out reviewed release automation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          path: .release-automation
          persist-credentials: false
          sparse-checkout: scripts/upload-release-assets.mjs
          sparse-checkout-cone-mode: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Configure sccache
        uses: mozilla/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9

      - name: Cache Rust registry and sources
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri
          cache-targets: "false"
          cache-on-failure: "true"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Configure prerelease updater channel
        if: env.RELEASE_CHANNEL == 'prerelease'
        run: node scripts/set-updater-channel.mjs prerelease

      - name: Determine Windows signing mode
        id: windows-signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ALLOW_UNSIGNED_NATIVE: ${{ inputs.allow_unsigned_native }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("TAURI_SIGNING_PRIVATE_KEY", "TAURI_SIGNING_PRIVATE_KEY_PASSWORD")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "$name is required" }
          }
          if ($env:ALLOW_UNSIGNED_NATIVE -eq "true") {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "WINDOWS_CODE_SIGNING_ENABLED=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "::warning::Publishing Windows artifacts without Authenticode because unsigned native artifacts are enabled."
            exit 0
          }
          $missing = @()
          foreach ($name in @("WINDOWS_CERTIFICATE", "WINDOWS_CERTIFICATE_PASSWORD")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { $missing += $name }
          }
          if ($missing.Count -gt 0) {
            throw "Windows releases require Authenticode signing secrets unless unsigned native artifacts are explicitly allowed: $($missing -join ', ')"
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "glyph-signing-certificate.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificates = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
          $certificate = $certificates | Where-Object HasPrivateKey | Select-Object -First 1
          if ($null -eq $certificate) { throw "Imported Windows certificate has no private key" }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_CODE_SIGNING_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build NSIS installer
        shell: pwsh
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:WINDOWS_CODE_SIGNING_ENABLED -eq "1") {
            $config = @{
              bundle = @{
                windows = @{
                  certificateThumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT
                  digestAlgorithm = "sha256"
                  timestampUrl = "http://timestamp.digicert.com"
                }
              }
            } | ConvertTo-Json -Compress -Depth 4
            bun tauri build --bundles nsis --ci --config $config
          } else {
            bun tauri build --bundles nsis --ci
          }

      - name: Validate Windows assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -File -Filter "*.exe")
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)" }
          $installer = $installers[0]
          $signature = Get-Item "$($installer.FullName).sig"
          if ($installer.Length -le 0 -or $signature.Length -le 0) { throw "Installer or updater signature is empty" }
          $authenticode = Get-AuthenticodeSignature $installer.FullName
          if ($env:WINDOWS_CODE_SIGNING_ENABLED -eq "1") {
            if ($authenticode.Status -ne "Valid") { throw "Installer Authenticode status is $($authenticode.Status): $($authenticode.StatusMessage)" }
            if ($null -eq $authenticode.TimeStamperCertificate) { throw "Installer signature is not timestamped" }
          } else {
            Write-Host "::notice::Skipping Windows Authenticode validation for unsigned installer. Status: $($authenticode.Status)"
          }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -NoNewline SHA256SUMS-windows.txt

      - name: Attest Windows release assets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            SHA256SUMS-windows.txt

      - name: Upload Windows assets to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -File -Filter "*.exe" | Select-Object -First 1
          node .release-automation/scripts/upload-release-assets.mjs $env:RELEASE_TAG $installer.FullName "$($installer.FullName).sig" SHA256SUMS-windows.txt

  create-manifest:
    name: Create updater manifest
    runs-on: ubuntu-latest
    needs: [prepare-release, release-linux, release-macos, release-windows]
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Check out reviewed release automation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          path: .release-automation
          persist-credentials: false
          sparse-checkout: |
            scripts/create-updater-manifest.sh
            scripts/upload-release-assets.mjs
          sparse-checkout-cone-mode: false

      - name: Generate updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
          UPDATER_MANIFEST: ${{ env.UPDATER_MANIFEST }}
        run: |
          .release-automation/scripts/create-updater-manifest.sh "$RELEASE_TAG" "$GH_REPO" "$UPDATER_MANIFEST"

      - name: Attest updater manifest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ env.UPDATER_MANIFEST }}

      - name: Upload updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          UPDATER_MANIFEST: ${{ env.UPDATER_MANIFEST }}
        run: node .release-automation/scripts/upload-release-assets.mjs "$RELEASE_TAG" "$UPDATER_MANIFEST"

  publish-release:
    name: Validate and publish release
    runs-on: ubuntu-latest
    needs: [prepare-release, create-manifest]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Check out reviewed release validation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          path: .release-automation
          persist-credentials: false
          sparse-checkout: scripts/validate-release-assets.mjs
          sparse-checkout-cone-mode: false

      - name: Install updater signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: Validate complete release asset set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
          UPDATER_MANIFEST: ${{ env.UPDATER_MANIFEST }}
        run: node .release-automation/scripts/validate-release-assets.mjs "$RELEASE_TAG" "$GH_REPO" "$UPDATER_MANIFEST"

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CHANNEL: ${{ env.RELEASE_CHANNEL }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CHANNEL" == "prerelease" ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
